[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "verified-xfer"
version = "0.1.0"
description = "Verified stage + retrieve of test files to/from Linux shared folders"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
sftp = ["paramiko>=3.0"]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "pydantic>=2.0"]
dev = ["pytest>=7.0"]

[project.scripts]
verified-xfer = "verified_xfer.cli:main"
verified-xfer-web = "verified_xfer.web.app:main"

[tool.setuptools.packages.find]
where = ["src"]
